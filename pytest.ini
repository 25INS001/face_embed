[pytest]
# tests/contract  hermetic. Django test client with the inference stack stubbed
#                 (see tests/stubs.py) — no torch, no model download, no network.
# tests/live      black-box HTTP against a running face_embed, which does load
#                 the real model. Skipped unless --live is passed.
#
#   pip install -r tests/requirements.txt
#   pytest                # hermetic only — the CI default
#   pytest --live         # adds the live layer
DJANGO_SETTINGS_MODULE = tests.settings
# detection/tests.py predates this suite and is collected alongside it.
testpaths = tests detection
# tests.py matches Django's own convention, used by the app-level file.
python_files = test_*.py tests.py
python_functions = test_*

markers =
    contract: hermetic; Django test client, inference stubbed
    live: requires a running face_embed with the real model (enable with --live)
    fuzz: malformed, hostile or oversized input
    defect: encodes a known-broken behaviour

filterwarnings =
    ignore::DeprecationWarning
